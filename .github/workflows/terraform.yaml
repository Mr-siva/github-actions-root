name: Terraform Deployment

on:
  workflow_call:
    inputs:
      env_name:
        description: "Environment name (dev/uat/prod)"
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Child Repo
        uses: actions/checkout@v4

      # Checkout root repo to get OPA policies
      - name: Checkout Policy Repo
        uses: actions/checkout@v4
        with:
          repository: Mr-siva/github-actions-root
          path: policy-repo

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (JSON)
        run: |
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      # 🔐 Install OPA
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      # 🔍 Run OPA Policy Check
      - name: Run OPA Policy Check
        run: |
          opa eval --format pretty \
            --data policy-repo/policies/ \
            --input tfplan.json \
            "data.terraform.security.deny"

      # ❌ Fail pipeline if violations exist
      - name: Enforce OPA Policies
        run: |
          violations=$(opa eval --format raw \
            --data policy-repo/policies/ \
            --input tfplan.json \
            "data.terraform.security.deny")

          if [ "$violations" != "[]" ]; then
            echo "❌ OPA Policy Violations Found"
            echo "$violations"
            exit 1
          fi

      # Terraform Apply ONLY if OPA passed
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
